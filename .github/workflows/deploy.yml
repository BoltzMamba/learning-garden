name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily rebuild so the learning calendar picks up new GitHub contributions
  # without manual work (00:15 Asia/Singapore).
  schedule:
    - cron: '15 16 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the calendar's de-duplication reads which commits only changed notes.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Last good GitHub activity snapshot, used if GitHub is unreachable today.
      - uses: actions/cache@v6
        with:
          path: src/data/github-activity.json
          key: github-activity-${{ github.run_id }}
          restore-keys: github-activity-
      - name: Sync GitHub contributions
        run: npm run github:sync
        env:
          # Optional repository secret: a token of the BoltzMamba account itself
          # (classic PAT with `read:user`, or fine-grained with read-only access),
          # so GitHub returns the account's own view of its contributions.
          # Empty when unset or on pull requests from forks; the script then uses
          # the read-only workflow token (public calendar). Tokens are only used
          # here, never written to the cache or shipped to the browser.
          CONTRIBUTIONS_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Unit and CLI tests
        run: npm test
      - name: Type check
        run: npm run check
      # Strict bilingual publishing: every note needs a current English edition.
      # A failure stops the job here, so nothing is uploaded or deployed and the
      # live site keeps its previous version. (`npm run build` checks again.)
      - name: Check English translations (strict)
        run: npm run translate:check -- --strict
      - name: Build
        run: npm run build
      - name: Check internal links
        run: npm run check:links
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
